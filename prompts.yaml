generation:
  # Step 2 facts + Step 3 story prompts
  grounded_facts_system: |
    You extract grounded facts for RAG.
    Use only the provided chunks.
    Do not invent names, places, events, or objects.
    Every fact must include source chunk ids.
    Output only valid JSON, no prose or markdown.

  grounded_facts_user: |
    QUERY:
    {query}

    RETRIEVED_CHUNKS:
    {retrieval_chunks}

    Return JSON in this structure:
    {{
      "facts": [
        {{
          "type": "who|where|when|what|why|how|event|setting|detail",
          "fact": "<short, specific statement>",
          "source_chunk_ids": ["<chunk_id>", "..."],
          "quote": "<short verbatim phrase copied exactly from the chunk; use empty string only when no verbatim match exists>"
        }}
      ]
    }}

    Rules:
    - Target 10 to 30 facts when possible.
    - "quote": a verbatim phrase (under 15 words) copied character-for-character from the chunk; "" only if no close match exists.
    - Copy each "source_chunk_ids" value exactly from the [CHUNK <id> | title] headers above.
    - Give every named character, place, object, and date in the chunks its own fact.
    - Do not add keys other than "facts".

  grounded_story_system: |
    You are a grounded story writer.
    Follow grounded facts strictly.
    Do NOT introduce new named characters, places, groups, organizations, items, or events not present in the facts.
    Write all 5 sections in order under the given headers, finish SECTION 5 fully, and end with terminal punctuation.
    Output only story prose under headers.

  grounded_story_user: |
    QUERY:
    {query}

    GROUNDED_FACTS:
    {grounded_facts}

    Write one complete story. Use these 5 section headers, in this exact order, each on its own line:
    {section_headers}

    Rules:
    - Write each header followed by its prose, through SECTION 5. Prose, not an outline.
    {length_guidance}
    - Expand grounded facts with clear detail, pacing, and dialogue where natural.
    - You MUST write all five sections. Do not end the story until SECTION 5 reaches a
      finished, resolved final sentence.
    - Pace yourself: give each section roughly equal space so SECTION 5 is fully written
      within the target length. Never compress or rush the ending.
    - Do NOT introduce new named characters, places, or events not in the facts above.
    - If facts are sparse, deepen mood, setting, and motivation without inventing new named entities.
    - Dialogue rules:
        * Always close dialogue on the same line.
        * Never start narration paragraphs with a quote mark.
        * Use straight double quotes " for dialogue.
    - Return only story text (no outline, no JSON, no markdown, no commentary).

  # Step 3 sectioned mode (Story_generation_mode: sectioned): one call per section
  grounded_section_system: |
    You are a grounded story writer, writing ONE section of a five-section story.
    Follow the grounded facts strictly.
    Do NOT introduce new named characters, places, groups, organizations, items, or events not present in the facts.
    Output only the prose of the requested section: no header, no outline, no commentary.

  grounded_section_user: |
    QUERY:
    {query}

    GROUNDED_FACTS:
    {grounded_facts}

    STORY SO FAR:
    {story_so_far}

    Write ONLY this section: {header}

    Rules:
    - Write about {words} words ({min_sentences}+ complete sentences); never more than {max_words} words.
    - Continue naturally from the story so far; do not repeat or summarize it.
    - {ending_rule}
    - Dialogue: close quotes on the same line, never start narration with a quote, use straight " only.
    - Return only the prose for this section (no header, no JSON, no markdown, no commentary).
    {feedback_block}

  # Step 3 refine pass (agentic loop)
  grounded_story_refine_system: |
    You are a grounded story reviser.
    Revise the PREVIOUS_DRAFT using REVIEWER_FEEDBACK.
    Stay strictly grounded: do NOT introduce new named characters, places, groups, organizations, items, or events not present in the grounded facts.
    Keep what works and fix only requested issues.
    Return a complete story with all sections and a finished ending sentence.
    Preserve finished sections when possible and continue from the earliest incomplete section instead of restarting from scratch.

  grounded_story_refine_user: |
    QUERY:
    {query}

    GROUNDED_FACTS:
    {grounded_facts}

    PREVIOUS_DRAFT:
    {prior_draft}

    REVIEWER_FEEDBACK:
    {feedback}

    Rewrite the COMPLETE story in exactly 5 sections using these headers in order:
    {section_headers}

    Rules:
    - Begin with the first section header (no outline of headers); write prose under each.
    - Address every point in the reviewer feedback.
    {length_guidance}
    - If the draft is incomplete, prioritize completing missing/weak sections while preserving valid grounded content from earlier sections.
    - If the previous draft is short, expand with detail and dialogue instead of trimming.
    - If it was cut off or ran far past the target, tighten the earlier sections so all five fit.
    - Finish every section and complete the final sentence.
    - Dialogue: close quotes on the same line, never start narration with a quote, use straight " only.
    - Do NOT introduce new named characters, places, or events not in the grounded facts.
    - Return only revised story text (no JSON, no markdown, no commentary).

# Alternative generation method (Story_generation_method: arc): classic story-arc outline,
# one call per section. Separate from the 5W1H prompts above so the two can be compared.
generation_arc:
  section_system: |
    You are a story writer working from grounded facts, writing ONE section of a five-part story arc.
    Every named character, place, group, organization, item, and event must come from the grounded facts.
    Do NOT invent new ones; deepen mood, motive, and sensory detail instead.
    Output only the prose of the requested section: no header, no outline, no commentary.

  section_user: |
    QUERY:
    {query}

    GROUNDED_FACTS:
    {grounded_facts}

    STORY SO FAR:
    {story_so_far}

    Write ONLY this section: {header}
    Its job in the story: {role}

    Rules:
    - Write about {words} words ({min_sentences}+ complete sentences); never more than {max_words} words.
    - Continue from the story so far; do not repeat or summarize it.
    - Show events through concrete action, setting, and dialogue rather than explaining them.
    - {ending_rule}
    - Dialogue: close quotes on the same line, never start narration with a quote, use straight " only.
    - Return only the prose for this section (no header, no JSON, no markdown, no commentary).
    {feedback_block}

  roles:
    - "Show the ordinary world: who the protagonist is, where and when they live, and what they want or lack. No major conflict yet."
    - "Break the ordinary world: one event forces the protagonist to act. End on the decision to act."
    - "Escalate: the protagonist pursues the goal and meets obstacles that raise the stakes and cost something."
    - "The turning point: the decisive confrontation or choice where everything is at stake. Highest tension of the story."
    - "Show the consequences and how the world and the protagonist have changed, then close the story."

ingest:
  section_label_system: |
    Label a story chunk with one section tag.
    Output only the tag (no punctuation, quotes, or explanation).
    - Use lowercase letters, numbers, and underscores only.
    - Choose exactly one tag from:
      setup, inciting_incident, rising_action, confrontation, twist, climax, fallout, resolution, epilogue, setting, negotiation

  section_label_user: |
    TITLE: {title}
    CHUNK_ID: {chunk_id}
    CHUNK_INDEX: {chunk_index} / {chunk_total}

    CHUNK:
    {chunk_text}

    Output one tag from the allowed set.

# evaluation prompts
evaluation:
  with_story: |
    You are an expert story evaluator. Score the generated story with the criteria below.

    ## Generated Story:
    {story}

    {facts_section}## Evaluation Criteria:
    Score each item from 1-10.
    Use low scores (1-3) for loops, broken sentences, unreadable run-ons, or obvious copy-paste.
    Be strict and use the full scale: 5-6 = acceptable but flawed, 7-8 = good, 9-10 = near-flawless and rare.
    Do not give every criterion the same score. The story should have five "[SECTION n: ...]" headers;
    give Overall 1-3 if any is missing or the ending is cut off mid-sentence.

    1. **Coherence** (1-10): Clear beginning, middle, end? Logical flow without loops or broken transitions?
    2. **Grammar** (1-10): Readable and correct? Penalize run-ons and repeated filler phrases.
    3. **Creativity** (1-10): Varied and engaging? Penalize repeating the same sentence or image many times.
    4. **Faithfulness** (1-10): If grounded facts are given above, penalize every named character, place, or event the facts do not support and any contradiction of them (8+ only if the story stays within the facts). If no facts are given, score internal consistency.
    5. **Overall** (1-10): Holistic quality; low if generation clearly failed (no ending, loop, unreadable).

    ## Response Format:
    Return valid JSON in this structure:
    {{
        "coherence": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "grammar": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "creativity": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "faithfulness": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "overall": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "conclusion": "<2-3 sentence overall summary of the evaluation>",
        "suggestions": ["<improvement suggestion 1>", "<improvement suggestion 2>", ...]
    }}

    "suggestions" must be 2-4 concrete, actionable edits, each naming the section it applies to.
    Return only the JSON object.

  # Short-output judge for the agentic loop: scores only (no per-criterion prose), so a small
  # model cannot run out of tokens mid-JSON. Completeness/length are checked by rules in code.
  loop_judge: |
    You are a strict story judge. Score the story from 1-10 per criterion: 5-6 = acceptable but flawed,
    7-8 = good, 9-10 = near-flawless and rare. Do not give every criterion the same score.

    ## Story:
    {story}

    {facts_section}## Criteria:
    - faithfulness: 8+ only if every named character, place, and event is supported by the grounded facts above
      and nothing contradicts them; penalize each unsupported name. Without facts, score internal consistency.
    - coherence: clear beginning, middle, end; logical flow, no loops.
    - grammar: readable and correct; penalize run-ons and repeated filler.
    - creativity: varied and engaging; penalize repeated sentences or images.
    - overall: holistic quality; 1-3 if a "[SECTION n: ...]" header is missing, the ending is cut off, or it loops.

    Reply with ONLY this JSON object, in this key order, with no other text:
    {{"faithfulness": <1-10>, "coherence": <1-10>, "grammar": <1-10>, "creativity": <1-10>, "overall": <1-10>,
    "conclusion": "<one sentence, max 30 words>",
    "suggestions": ["<edit naming a section, max 25 words>", "<second edit>"]}}

  with_summary: |
    You are an expert story evaluator. Read the full story, then evaluate the summary.

    ## Whole story (source):
    {story}

    ## Summary to evaluate:
    {summary}

    ## Evaluation Criteria:
    Score the summary (not the source story) from 1-10 on each item. Be strict: 5-6 = acceptable but
    flawed, 7-8 = good, 9-10 = near-flawless and rare.

    1. **Coherence** (1-10): Is the summary clear and in sensible order? Any contradictions or gaps?
    2. **Grammar** (1-10): Spelling, punctuation, sentence structure.
    3. **Faithfulness** (1-10): Does the summary match the source story (no invented endings, no missing major beats)?
    4. **Overall** (1-10): Overall summary quality as a standalone piece.

    ## Response Format:
    Return valid JSON in this structure:
    {{
        "coherence": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "grammar": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "faithfulness": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "overall": {{
            "score": <1-10>,
            "feedback": "<brief explanation>"
        }},
        "conclusion": "<2-3 sentence overall summary of the evaluation>",
        "suggestions": ["<improvement suggestion 1>", "<improvement suggestion 2>", ...]
    }}

    Return only the JSON object.
