# StoryForge — example configuration (copy to setup.yaml and edit)
#
# Pipeline: Chroma retrieve → HF grounded facts → local 5-section story.
# Optional agentic loop: evaluate → refine / re-retrieve / accept.
#
# Secrets: prefer env vars (HUGGINGFACEHUB_API_TOKEN, etc.) over YAML.

# --- Paths ---
BASE_PATH: "C:/path/to/your/project"
Host: "127.0.0.1"   # set to "0.0.0.0" to accept connections from other devices/containers
Port: 8000

# --- API keys (leave blank; use env vars) ---
facehugging_api: ""
Gemini_api_key: ""
Google_book_api_key: ""

# --- Evaluation (agentic loop uses these scores) ---
# "api" (default) calls HF/Gemini below. "local" loads a small model
# in-process instead, removing the API round-trip from every agentic-loop
# iteration, and falls back to the API chain automatically if it errors.
# Offline / no HF credits: set Evaluation_mode: "local" (and keep the device on
# "cpu" so Ollama keeps the GPU). Without ANY working evaluator the agentic loop
# decides on completeness + facts only, and will not ACCEPT a draft that has
# zero grounded facts behind it.
Evaluation_mode: "api"
Local_evaluation_model: "Qwen/Qwen2.5-3B-Instruct"
Local_evaluation_device: "cpu"   # "cuda" only if you have VRAM to spare alongside Ollama
Local_evaluation_max_new_tokens: 700

Evaluation_provider_priority:
  - huggingface
  - gemini
HF_evaluation_model: "Qwen/Qwen2.5-7B-Instruct"
HF_evaluation_max_new_tokens: 700
HF_evaluation_temperature: 0.1
Gemini_evaluation_model: "gemini-3.7-flash"
Gemini_evaluation_fallback_model: "gemini-3.1-flash-lite"

# --- Data ---
Raw_extracted_dir: "data/raw_extracted"
Story_input: "data/stories"

# --- Output paths (omit and these fall back to Generated_Stories/ etc. at repo root) ---
Generated_story_output: "data/outputs/generated_stories"
Generated_summary_output: "data/outputs/summarized_stories"
Evaluated_stories_output: "data/outputs/evaluated_stories"

# --- Chroma vector store ---
Chroma_path: "data/chroma_db"
Chroma_collection_name: "StoryForgeRag_v1"
# After changing Vector_store_model, reset chroma_db and re-ingest.
Vector_store_model: "BAAI/bge-base-en-v1.5"
# Number of chunks actually passed to the fact-extraction step. Long story
# targets need more source material, or the model pads the extra words with
# repetition instead of grounded detail.
Story_generation_n_results: 10

# --- Step 2: grounded facts (HF API, no local VRAM) ---
HF_grounded_facts_model: "Qwen/Qwen3-8B"
# Must fit the 10-30 facts (with quotes) that prompts.yaml asks for; too low
# truncates the fact list and starves long stories of material. Measured
# (2026-09) on real 10-chunk retrieval pools (~3900-4050 prompt tokens):
# 1600 was NOT enough even with thinking disabled -- every call hit
# finish_reason="length" at exactly 1600 completion tokens, cutting the JSON
# off mid-object (~10-11 facts in) and making every extraction fail to parse
# (0 usable facts). Raised to 3200 for headroom up to ~20-25 facts; re-measure
# with scripts/measure_generation_length.py if extraction still truncates.
HF_grounded_facts_max_new_tokens: 3200
HF_grounded_facts_temperature: 0.1
# Try strict JSON mode for grounded-facts extraction (falls back if unsupported).
HF_grounded_facts_json_mode: true
# Qwen3 models emit hidden chain-of-thought reasoning by default, which counts
# against HF_grounded_facts_max_new_tokens above and can (measured: reliably
# did, with Qwen/Qwen3-8B) consume the whole budget before the model ever
# writes the JSON answer -- finish_reason "length", empty content, 0 facts.
# Keep this true unless you've confirmed your model/provider doesn't need it.
HF_grounded_facts_disable_thinking: true
# "hf" (default): HF API first, local model on failure.
# "local": skip HF entirely (offline / no HF credits) -- avoids a failed HF
# request + retries on every query. The local call uses Generation_provider
# (Ollama by default) with HF_grounded_facts_max_new_tokens / _temperature.
Grounded_facts_provider: "hf"
# Ollama output constraint for the LOCAL facts call: "schema" (grammar-constrained
# JSON, Ollama >= 0.5), "json" (plain JSON mode, older Ollama), or "off".
# If Ollama rejects the format the call is retried once without it.
Local_grounded_facts_json_format: "schema"
# Extra local attempts when an answer yields 0 usable facts (asks for fewer,
# shorter facts -- truncation is the usual cause). 0 disables the retry.
Local_grounded_facts_retries: 1
Local_grounded_facts_compact_max_facts: 12

# --- Step 3: story generation ---
# Provider: ollama | vllm | transformers
#   ollama       — Ollama Docker container (default, easiest to run)
#   vllm         — vLLM OpenAI-compatible server (higher throughput, run alongside FastAPI):
#                    python -m vllm.entrypoints.openai.api_server \
#                      --model Qwen/Qwen2.5-7B-Instruct \
#                      --dtype bfloat16 --max-model-len 8192 --port 8001
#   transformers — local HuggingFace pipeline (single-process, lower throughput)
Generation_provider: ollama
Generative_model: "qwen3.5:9b"
Ollama_base_url: "http://localhost:11434"
# vLLM settings (only used when Generation_provider: vllm)
vLLM_base_url: "http://localhost:8001/v1"
vLLM_model: "Qwen/Qwen2.5-7B-Instruct"
# Precision for Transformers only (ignored when Generation_provider: ollama or vllm)
Generation_precision: "auto"
Model_max_prompt_tokens: 12288
Generation_fast_temperature: 0.4
Generation_fast_top_p: 0.8
# Token FLOOR for the generation budget. The length target below raises this
# when it needs more room; it is a ceiling on output, so a generous value is safe.
Single_pass_fast_max_tokens: 3200
# Thinking/medium mode knobs (used when request mode is "thinking"/"medium")
Generation_thinking_temperature: 0.35
Generation_thinking_top_p: 0.85
Single_pass_thinking_max_tokens: 4000
# Anti-loop decoding controls (applies to both fast and thinking modes)
Generation_repetition_penalty: 1.08
Generation_no_repeat_ngram_size: 4
Single_pass_refine_max_tokens: 2800

## Story length target
# A single target drives three things that must agree, or output never grows:
# the prompt's words/sentences-per-section instruction, the token budget, and
# the accept gate (minimum words + minimum sentences per section). Because they
# are all derived from one number, Min_sentences_per_section and
# Agentic_loop_min_words are no longer set by hand.
#
# A target may be a preset name, a narration duration ("12min"), or a word
# count (1800). Requests may override it per call with the `length` field.
Story_length_presets:
  short: 450      # ~3 min narration
  medium: 900     # ~6 min
  long: 1500      # ~11 min
  epic: 2200      # ~16 min
Story_length_default_fast: "short"
Story_length_default_thinking: "long"
Story_length_words_per_minute: 140     # narration pace for "Nmin" targets
Story_length_max_new_tokens_cap: 6000  # hard ceiling, incl. refine boosts

# Post-check for unknown names. false = log only; true = may truncate.
Attribution_gate_truncate: false
Attribution_violation_threshold: 8

# --- Reranker (after Chroma, before Step 2) ---
Reranker_enabled: true
Reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
Story_generation_rerank_top_n: 10   # keep >= Story_generation_n_results

# --- GPU placement for the small helper models (reranker + retrieval embedder) ---
# Both do a handful of encodes per request -- well under a second on CPU -- so
# "cpu" is the default. Putting them on "cuda" alongside Ollama's own CUDA
# context can starve the generation LLM of VRAM. Set to "cuda" only if you have
# VRAM to spare.
Reranker_device: "cpu"
Embedding_device: "cpu"

# --- Hybrid search (BM25 + dense, fused via RRF) ---
# false = pure dense vector (original behaviour)
Hybrid_search_enabled: true
# 0.0-1.0; 0.3 gives BM25 30% and dense 70% -- but only when Reranker_enabled is
# false. With reranking on (the default), retrieve_docs() reranks the *entire*
# fused candidate pool with the cross-encoder before diversity selection, and
# that rerank re-scores every candidate from scratch, so the final top-1/top-k
# order does not depend on the fusion order this weight controls. Confirmed via
# the retrieval_eval A/B (2026-09): this weight is currently a no-op on final
# results whenever Reranker_enabled is true. It still matters if you disable
# reranking, since diversity then reads directly off this fused order.
Hybrid_bm25_weight: 0.3

# --- Agentic loop ---
Agentic_loop_enabled: true
Agentic_loop_max_iterations: 3
Agentic_loop_accept_score: 7.0
Agentic_loop_min_faithfulness: 6
Agentic_loop_min_facts: 3
Agentic_loop_reretrieve_k_boost: 2.0
Agentic_loop_reretrieve_n_results: 5
Agentic_loop_refine_token_boost: 600
Agentic_loop_refine_token_boost_thinking: 900
# Minimum word count and minimum sentences per section come from the story
# length target above, so the loop cannot accept a draft shorter than the
# prompt asked for.

# --- Book search (optional) ---
Archive_url: "https://archive.org/advancedsearch.php"
Archive_metadata_url: "https://archive.org/metadata/"
Downloaded_rawbook_dir: "Downloaded_Books"
Downloaded_data_meta: "Downloaded_Metadata"

Book_data:
  - id
  - title
  - authors
  - description

Download_formats:
  - pdf
  - epub
